name: PR Quality and Security Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-security-gate:
    name: quality-security-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify and package
        run: mvn -B clean verify

      - name: Checkstyle quality gate
        run: >
          mvn -B
          org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:check
          -Dcheckstyle.config.location=config/quality/checkstyle.xml

      - name: PMD quality gate
        run: >
          mvn -B
          org.apache.maven.plugins:maven-pmd-plugin:3.23.0:check

      - name: SpotBugs quality gate
        run: >
          mvn -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          -Dspotbugs.threshold=High
          -Dspotbugs.effort=Max

      - name: OWASP dependency security scan
        run: >
          mvn -B
          org.owasp:dependency-check-maven:12.1.3:check
          -Dformat=HTML
          -DfailBuildOnCVSS=11
